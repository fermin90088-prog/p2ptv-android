name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Misma clave de firma en cada compilación: así la APK nueva se instala encima de la anterior
      - name: Clave de firma fija
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: P2PTV-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Solo en las solicitudes de cambios: versión de PRUEBA con enlace público (no es la oficial ni la "más reciente")
      - name: Publicar APK de prueba
        if: github.event_name == 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prueba
          name: APK de prueba (no es la oficial)
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar enlace de descarga
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: APK más reciente
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
